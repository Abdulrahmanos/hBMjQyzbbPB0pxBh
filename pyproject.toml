[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-trading-agent"
version = "0.5.0"
description = "A reproducible, paper-first Bitcoin trading research agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["numpy>=2.3,<3", "pandas>=2.3,<4", "matplotlib>=3.10,<4"]

[project.scripts]
bitcoin-agent = "bitcoin_agent.cli:main"

[tool.setuptools.packages.find]
include = ["bitcoin_agent*", "research_lstm*"]
