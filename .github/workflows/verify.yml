name: Verify source and container
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-research.lock.txt
      - run: python -m unittest discover -s tests -v
      - run: docker compose config --quiet
      - run: docker build --tag bitcoin-paper:test .
      - run: docker run --rm bitcoin-paper:test python -m bitcoin_agent --config config/paper.json validate-config
