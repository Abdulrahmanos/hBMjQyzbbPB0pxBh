{
  "name": "bitcoin-evaluation",
  "services": {
    "paper": {
      "build": ".",
      "image": "bitcoin-evaluation:local",
      "restart": "on-failure:5",
      "init": true,
      "read_only": true,
      "user": "10001:10001",
      "tmpfs": [
        "/tmp"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "stop_grace_period": "90s",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "5m",
          "max-file": "3"
        }
      },
      "command": [
        "python",
        "tools/cloud_evaluation.py",
        "paper"
      ],
      "volumes": [
        "cloud_paper:/app/var"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "tools/cloud_evaluation.py",
          "health"
        ],
        "interval": "30s",
        "timeout": "15s",
        "retries": 3,
        "start_period": "600s"
      }
    },
    "adviser": {
      "build": ".",
      "image": "bitcoin-evaluation:local",
      "restart": "on-failure:5",
      "init": true,
      "read_only": true,
      "user": "10001:10001",
      "tmpfs": [
        "/tmp"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "stop_grace_period": "90s",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "5m",
          "max-file": "3"
        }
      },
      "command": [
        "python",
        "tools/cloud_evaluation.py",
        "adviser",
        "--runtime",
        "/app/evidence/cloud-week"
      ],
      "volumes": [
        "cloud_paper:/app/evidence:ro",
        "cloud_adviser:/app/var"
      ],
      "secrets": [
        "openai"
      ],
      "depends_on": {
        "paper": {
          "condition": "service_started"
        }
      }
    }
  },
  "volumes": {
    "cloud_paper": {},
    "cloud_adviser": {}
  },
  "secrets": {
    "openai": {
      "file": "./var/secrets/cloud-openai.env"
    }
  }
}
